variables:
  TRANSFER_METER_FREQUENCY: "5s"
  GIT_STRATEGY: "clone"
  GIT_DEPTH: 1
  KERNEL_IMAGE: "arch/arm/boot/zImage"
  REGISTRY_BASE: "registry.gfnd.rcn-ee.org:5000/ci"
  RUN_CI_GIT_UPDATE: "true"

stages:
  - build

before_script:
  - export PATH=/usr/lib/ccache:$PATH
  - export CCACHE_DIR=/dev/shm/my-ccache-in-memory
  - export DEBEMAIL="$GITLAB_USER_EMAIL"
  - export DEBFULLNAME="$GITLAB_USER_NAME"
  - df -h /dev/shm
  - git config --global user.email "$GITLAB_USER_EMAIL"
  - git config --global user.name "$GITLAB_USER_NAME"
  - . version.sh && echo $BRANCH

after_script:
    - rm -rf $CI_PROJECT_DIR/KERNEL/

.script_fragments:
  setup_ccache:
    - |
      if [ "$RUN_CI_GIT_UPDATE" = "true" ]; then
        ./tools/ci-git.sh
      else
        echo "Skipping ci-git.sh because RUN_CI_GIT_UPDATE is not true"
      fi
    - ./tools/ci-setup-ccache.sh
  cleanup_ccache:
    - ./tools/ci-cleanup-ccache.sh

.base_build:
  stage: build
  tags:
    - docker-amd64
  resource_group: $TARGET_LOCK_NAME
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - when: always

.debian_build_template:
  extends: .base_build
  variables:
    SYSTEM_SH_SRC: "system.sh.gitlab"
    CHECK_FILE: "deploy/linux-image-*.deb"
  cache:
    key: "$CI_PROJECT_NAME-$CI_COMMIT_BRANCH-debian-$CI_DISTRO-amd64"
    paths:
      - ccache.tar.zst
  script:
    - !reference [.script_fragments, setup_ccache]
    - cp -v $SYSTEM_SH_SRC system.sh
    - ./build_deb.sh
    - du -sh $CHECK_FILE || exit 1
    - !reference [.script_fragments, cleanup_ccache]

.kernel_build_template:
  extends: .base_build
  variables:
    SYSTEM_SH_SRC: "system.sh.gitlab.crosstool"
    CHECK_FILE: "KERNEL/$KERNEL_IMAGE"
  cache:
    key: "$CI_PROJECT_NAME-$CI_COMMIT_BRANCH-$CI_DISTRO-amd64"
    paths:
      - ccache.tar.zst
      - dl/*.tar.xz
  script:
    - !reference [.script_fragments, setup_ccache]
    - cp -v $SYSTEM_SH_SRC system.sh
    - ./build_kernel.sh
    - du -sh $CHECK_FILE || exit 1
    - !reference [.script_fragments, cleanup_ccache]

build-debian-13-amd64:
  extends: .debian_build_template
  image: $REGISTRY_BASE/beagle-devscripts-kernel-debian-13-amd64:latest
  variables:
    TARGET_LOCK_NAME: "lock-debian-13-$CI_COMMIT_BRANCH"
    CI_DISTRO: "13"
  artifacts:
    expire_in: 1 week
    name: "$CI_PROJECT_NAME-$CI_COMMIT_BRANCH-debian-13-$CI_JOB_ID"
    paths:
      - "deploy/linux-image-*.deb"

build-debian-14-amd64:
  extends: .debian_build_template
  image: $REGISTRY_BASE/beagle-devscripts-kernel-debian-14-amd64:latest
  variables:
    TARGET_LOCK_NAME: "lock-debian-14-$CI_COMMIT_BRANCH"
    CI_DISTRO: "14"

build-kernel:
  extends: .kernel_build_template
  parallel:
    matrix:
      - CI_DISTRO: "ubuntu"
        VERSION: "26.04"
      - CI_DISTRO: "fedora"
        VERSION: "44"
  image: $REGISTRY_BASE/beagle-devscripts-kernel-$CI_DISTRO-$VERSION-amd64:latest
  variables:
    TARGET_LOCK_NAME: "lock-$CI_DISTRO-$CI_COMMIT_BRANCH"