    paths:
      - ccache.tar.zst
      - dl/*.tar.xz
  tags:
    - docker-amd64
  stage: build
  script:
    - echo "Acquire::http::Proxy \"http://192.168.1.10:3142\";" > /etc/apt/apt.conf.d/00aptproxy
    - apt-get update
    - apt-get dist-upgrade -yq
    - cd /opt/linux-src/ ; git pull || true ; sync ; git gc --force --auto ; cd -
