before_script:
  - export PATH=/usr/lib/ccache:$PATH
  - git config --global user.email "$GITLAB_USER_EMAIL"
  - git config --global user.name "$GITLAB_USER_NAME"

build-debian-10-amd64:
  image: robertcnelson/beagle-devscripts-kernel-debian-10-amd64:latest
  # https://openbeagle.org/beagleboard/ci-docker-images
  cache:
    key: "$CI_PROJECT_NAME-$CI_COMMIT_BRANCH-debian-10-amd64"
    paths:
      - ccache.tar.lz4
  tags:
    - docker-amd64
  stage: build
  script:
    - . version.sh && echo $BRANCH
    - mkdir -p /root/.cache/ccache/ || true
    - tar --use-compress-program=lz4 -xf ccache.tar.lz4 -C / || true
    - ccache -M 2G
    - ccache -z
    - cp -v system.sh.gitlab system.sh
    - ./build_kernel.sh
    - du -sh deploy/*-dtbs.tar.gz || exit 1
    - du -sh deploy/*-modules.tar.gz || exit 1
    - du -sh deploy/*.zImage || exit 1
    - ccache -s
    - tar --use-compress-program=lz4 -cf ccache.tar.lz4 /root/.cache/ccache/
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - when: always
  artifacts:
    expire_in: 1 week
    name: "$CI_PROJECT_NAME-$CI_COMMIT_BRANCH-debian-10-$CI_JOB_ID"
    paths:
      - "deploy/*-dtbs.tar.gz"
      - "deploy/*-modules.tar.gz"
      - "deploy/*.zImage"

