before_script:
  - export PATH=/usr/lib/ccache:$PATH
  - git config --global user.email "$GITLAB_USER_EMAIL"
  - git config --global user.name "$GITLAB_USER_NAME"

build-debian-9-amd64:
  image: robertcnelson/beagle-devscripts-kernel-debian-9-amd64:latest
  # https://openbeagle.org/beagleboard/ci-docker-images
  cache:
    key: "$CI_PROJECT_NAME-$CI_COMMIT_BRANCH-debian-9-amd64"
    paths:
      - ccache.tar.gz
  tags:
    - docker-amd64
  stage: build
  script:
    - . version.sh && echo $BRANCH
    - mkdir -p /root/.cache/ccache/ || true
    - tar -xzf ccache.tar.gz -C / || true
    - ccache -M 1G
    - ccache -z
    - cp -v system.sh.gitlab system.sh
    - ./build_deb.sh
    - du -sh deploy/linux-image-*.deb || exit 1
    - ccache -s
    - tar -czf ccache.tar.gz /root/.cache/ccache/
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - when: always
  artifacts:
    expire_in: 1 week
    name: "$CI_PROJECT_NAME-$CI_COMMIT_BRANCH-debian-9-$CI_JOB_ID"
    paths:
      - "deploy/linux-image-*.deb"

