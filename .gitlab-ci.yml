before_script:
  - git config --global user.email "$GITLAB_USER_EMAIL"
  - git config --global user.name "$GITLAB_USER_NAME"

build-debian-7-armhf:
  image: robertcnelson/beagle-devscripts-kernel-debian-7-armhf:latest
  # https://openbeagle.org/beagleboard/ci-docker-images
  tags:
    - docker-aarch64-rpi4-ci
  stage: build
  script:
    - . version.sh && echo $BRANCH
    - cp -v system.sh.gitlab.wheezy system.sh
    - ./build_kernel.sh
    - du -sh deploy/*-dtbs.tar.gz || exit 1
    - du -sh deploy/*-modules.tar.gz || exit 1
    - du -sh deploy/*.zImage || exit 1
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - when: always
  artifacts:
    expire_in: 1 week
    name: "$CI_PROJECT_NAME-$CI_COMMIT_BRANCH-debian-7-$CI_JOB_ID"
    paths:
      - "deploy/*-dtbs.tar.gz"
      - "deploy/*-modules.tar.gz"
      - "deploy/*.zImage"

build-debian-8-armhf:
  image: robertcnelson/beagle-devscripts-kernel-debian-8-armhf:latest
  # https://openbeagle.org/beagleboard/ci-docker-images
  cache:
    key: "$CI_PROJECT_NAME-$CI_COMMIT_BRANCH-debian-8-armhf"
    paths:
      - ccache.tar.gz
  tags:
    - docker-aarch64-rpi4-ci
  stage: build
  script:
    - export PATH=/usr/lib/ccache:$PATH
    - . version.sh && echo $BRANCH
    - mkdir -p /root/.cache/ccache/ || true
    - tar -xzf ccache.tar.gz -C / || true
    - ccache -M 2G
    - ccache -z
    - cp -v system.sh.gitlab system.sh
    - ./build_kernel.sh
    - du -sh deploy/*-dtbs.tar.gz || exit 1
    - du -sh deploy/*-modules.tar.gz || exit 1
    - du -sh deploy/*.zImage || exit 1
    - ccache -s
    - tar -czf ccache.tar.gz /root/.cache/ccache/
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - when: always
  artifacts:
    expire_in: 1 week
    name: "$CI_PROJECT_NAME-$CI_COMMIT_BRANCH-debian-8-$CI_JOB_ID"
    paths:
      - "deploy/*-dtbs.tar.gz"
      - "deploy/*-modules.tar.gz"
      - "deploy/*.zImage"
