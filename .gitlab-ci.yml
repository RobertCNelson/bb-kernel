variables:
  TRANSFER_METER_FREQUENCY: "5s"
  GIT_STRATEGY: "clone"
  GIT_DEPTH: 1
  KERNEL_IMAGE: "arch/arm/boot/zImage"

before_script:
  - export PATH=/usr/lib/ccache:$PATH
  - export CCACHE_DIR=/dev/shm/my-ccache-in-memory
  - export DEBEMAIL="$GITLAB_USER_EMAIL"
  - export DEBFULLNAME="$GITLAB_USER_NAME"
  - df -h /dev/shm
  - git config --global user.email "$GITLAB_USER_EMAIL"
  - git config --global user.name "$GITLAB_USER_NAME"
  - . version.sh && echo $BRANCH

after_script:
    - rm -rf $CI_PROJECT_DIR/KERNEL/

.script_fragments:
  setup_ccache:
    - ./tools/ci-git.sh
    - ./tools/ci-setup-ccache.sh
  cleanup_ccache:
    - ./tools/ci-cleanup-ccache.sh

.base_build:
  stage: build
  tags:
    - docker-amd64
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - when: always

.debian_build_template:
  extends: .base_build
  cache:
    key: "$CI_PROJECT_NAME-$CI_COMMIT_BRANCH-debian-$CI_DISTRO-amd64"
    paths:
      - ccache.tar.zst
  script:
    - !reference [.script_fragments, setup_git_ccache]
    - cp -v $SYSTEM_SH_SRC system.sh
    - ./build_deb.sh
    - du -sh $CHECK_FILE || exit 1
    - !reference [.script_fragments, cleanup_ccache]

.kernel_build_template:
  extends: .base_build
  cache:
    key: "$CI_PROJECT_NAME-$CI_COMMIT_BRANCH-$CI_DISTRO-amd64"
    paths:
      - ccache.tar.zst
      - dl/*.tar.xz
  script:
    - !reference [.script_fragments, setup_ccache]
    - cp -v $SYSTEM_SH_SRC system.sh
    - ./build_kernel.sh
    - du -sh $CHECK_FILE || exit 1
    - !reference [.script_fragments, cleanup_ccache]

build-debian-13-amd64:
  extends: .debian_build_template
  image: registry.gfnd.rcn-ee.org:5000/ci/beagle-devscripts-kernel-debian-13-amd64:latest
  # https://openbeagle.org/beagleboard/ci-docker-images
  variables:
    CI_DISTRO: "13"
    SYSTEM_SH_SRC: "system.sh.gitlab"
    CHECK_FILE: "deploy/linux-image-*.deb"
  script:
    - !reference [.debian_build_template, script]
  artifacts:
    expire_in: 1 week
    name: "$CI_PROJECT_NAME-$CI_COMMIT_BRANCH-debian-13-$CI_JOB_ID"
    paths:
      - "deploy/linux-image-*.deb"

build-debian-14-amd64:
  extends: .debian_build_template
  image: registry.gfnd.rcn-ee.org:5000/ci/beagle-devscripts-kernel-debian-14-amd64:latest
  # https://openbeagle.org/beagleboard/ci-docker-images
  variables:
    CI_DISTRO: "14"
    SYSTEM_SH_SRC: "system.sh.gitlab"
    CHECK_FILE: "deploy/linux-image-*.deb"
  script:
    - !reference [.debian_build_template, script]

build-ubuntu-26.04-amd64:
  extends: .kernel_build_template
  image: registry.gfnd.rcn-ee.org:5000/ci/beagle-devscripts-kernel-ubuntu-26.04-amd64:latest
  # https://openbeagle.org/beagleboard/ci-docker-images
  variables:
    CI_DISTRO: "ubuntu"
    SYSTEM_SH_SRC: "system.sh.gitlab.crosstool"
    CHECK_FILE: "KERNEL/$KERNEL_IMAGE"
  script:
    - !reference [.kernel_build_template, script]

build-fedora-44-amd64:
  extends: .kernel_build_template
  image: registry.gfnd.rcn-ee.org:5000/ci/beagle-devscripts-kernel-fedora-44-amd64:latest
  # https://openbeagle.org/beagleboard/ci-docker-images
  variables:
    CI_DISTRO: "fedora"
    SYSTEM_SH_SRC: "system.sh.gitlab.crosstool"
    CHECK_FILE: "KERNEL/$KERNEL_IMAGE"
  script:
    - !reference [.kernel_build_template, script]
