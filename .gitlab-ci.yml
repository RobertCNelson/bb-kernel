    - ./build_kernel.sh
    - du -sh KERNEL/$KERNEL_IMAGE || exit 1
    - ccache -sv
    - df -h /dev/shm
    - tar --use-compress-program='zstd -6' -cf ccache.tar.zst /dev/shm/my-ccache-in-memory
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - when: always

