build-debian-14-amd64:
  image: robertcnelson/beagle-devscripts-kernel-debian-14-amd64:latest
  # https://openbeagle.org/beagleboard/ci-docker-images
  cache:
    key: "$CI_PROJECT_NAME-$CI_COMMIT_BRANCH-debian-14-amd64"
    paths:
      - ccache.tar.zst
  tags:
    - docker-amd64
  stage: build
  script:
    - echo "Acquire::http::Proxy \"http://192.168.1.10:3142\";" > /etc/apt/apt.conf.d/00aptproxy
    - apt-get update
    - apt-get dist-upgrade -yq
    - tar --zstd -xf ccache.tar.zst -C / || true
    - df -h /dev/shm
    - ccache -M 5G
    - ccache -sv
    - ccache --recompress=uncompressed
    - ccache -z
    - cp -v system.sh.gitlab system.sh
    - ./build_deb.sh
