variables:
  TRANSFER_METER_FREQUENCY: "5s"
  GIT_STRATEGY: "clone"
  GIT_DEPTH: 1
  KERNEL_IMAGE: "arch/arm/boot/zImage"
  REGISTRY_BASE: "registry.gfnd.rcn-ee.org:5000/ci"
  RUN_CI_GIT_UPDATE: "true"
  RUN_CI_DT_SCHEMA_CHECKER: "false"
  DEBIAN_VERSION_ARTIFACTS: "13"

stages:
  - build

before_script:
  - export PATH=/usr/lib/ccache:$PATH
  - export CCACHE_DIR=/dev/shm/my-ccache-in-memory
  - export DEBEMAIL="$GITLAB_USER_EMAIL"
  - export DEBFULLNAME="$GITLAB_USER_NAME"
  - df -h /dev/shm
  - git config --global user.email "$GITLAB_USER_EMAIL"
  - git config --global user.name "$GITLAB_USER_NAME"
  - . version.sh && echo $BRANCH

after_script:
  - rm -rf $CI_PROJECT_DIR/KERNEL/

.script_fragments:
  setup_dt_schema:
    - |
      if [ "$RUN_CI_DT_SCHEMA_CHECKER" = "true" ]; then
        export PATH=/root/.local/bin:$PATH
        ./tools/ci-dt-schema.sh
      else
        echo "Skipping ci-dt-schema.sh because RUN_CI_DT_SCHEMA_CHECKER is not true"
      fi
  setup_ccache:
    - |
      if [ "$RUN_CI_GIT_UPDATE" = "true" ]; then
        ./tools/ci-git.sh
      else
        echo "Skipping ci-git.sh because RUN_CI_GIT_UPDATE is not true"
      fi
    - ./tools/ci-setup-ccache.sh
  cleanup_ccache:
    - ./tools/ci-cleanup-ccache.sh

.unified_build_template:
  stage: build
  tags:
    - docker-amd64
  resource_group: lock-$CI_DISTRO-$VERSION-$CI_COMMIT_BRANCH
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - when: always
  cache:
    key: "$CI_PROJECT_NAME-$CI_COMMIT_BRANCH-$CI_DISTRO-$VERSION-amd64"
    paths:
      - ccache.tar.zst
      - dl/*.tar.xz
  script:
    - !reference [.script_fragments, setup_dt_schema]
    - !reference [.script_fragments, setup_ccache]
    - cp -v $SYSTEM_SH_SRC system.sh
    
    # --- 1. PREPARE BUILD CONFIGURATION & DYNAMIC PATHS ---
    - |
      if [ "$CI_DISTRO" = "debian" ]; then
        BUILD_SCRIPT="build_deb.sh"
        CHECK_PATH="deploy/linux-image-*.deb"
        echo "Mode: Debian Build"
      else
        BUILD_SCRIPT="build_kernel.sh"
        CHECK_PATH="KERNEL/$KERNEL_IMAGE"
        echo "Mode: Kernel Build ($CI_DISTRO)"
      fi
      echo "Running $BUILD_SCRIPT..."
      echo "Will verify path: $CHECK_PATH"

    # --- 2. EXECUTE BUILD ---
    - ./$BUILD_SCRIPT

    # --- 3. POST-BUILD: VERIFICATION & ARTIFACT MANAGEMENT ---
    - |
      echo "Verifying: $CHECK_PATH"
      if ls $CHECK_PATH >/dev/null 2>&1; then
        echo "Success: $CHECK_PATH found."
        find . -name "$(echo $CHECK_PATH | sed 's/\*//')" -exec du -sh {} +
      else
        echo "Error: $CHECK_PATH NOT FOUND!"
        exit 1
      fi

      if [ "$CI_DISTRO" = "debian" ]; then
        export DEBIAN_VERSION_ARTIFACTS="$DEBIAN_VERSION_ARTIFACTS"
        if [ "$VERSION" != "$DEBIAN_VERSION_ARTIFACTS" ]; then
          echo "Version $VERSION is not $DEBIAN_VERSION_ARTIFACTS: Hiding debian artifacts."
          mkdir -p .hidden_artifacts
          find deploy/ -name "linux-image-*.deb" -exec mv {} .hidden_artifacts/ \; || true
        fi
      fi
    # ---------------------------------------------------------

    - !reference [.script_fragments, cleanup_ccache]

build-all:
  extends: .unified_build_template
  image: $REGISTRY_BASE/beagle-devscripts-kernel-$CI_DISTRO-$VERSION-amd64:latest
  artifacts:
    expire_in: 1 week
    name: "$CI_PROJECT_NAME-$CI_COMMIT_BRANCH-$CI_DISTRO-$VERSION-$CI_JOB_ID"
    paths:
      - "deploy/linux-image-*.deb"
  parallel:
    matrix:
      # --- DEBIAN ---
      - CI_DISTRO: "debian"
        VERSION: "13"
        SYSTEM_SH_SRC: "system.sh.gitlab"
      - CI_DISTRO: "debian"
        VERSION: "14"
        SYSTEM_SH_SRC: "system.sh.gitlab"
      # --- KERNEL ---
      - CI_DISTRO: "ubuntu"
        VERSION: "26.04"
        SYSTEM_SH_SRC: "system.sh.gitlab.crosstool"
      - CI_DISTRO: "fedora"
        VERSION: "44"
        SYSTEM_SH_SRC: "system.sh.gitlab.crosstool"
