    - ccache -sv
    - df -h /dev/shm
    - tar --use-compress-program='zstd -9' -cf ccache.tar.zst /dev/shm/my-ccache-in-memory
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - when: always
  artifacts:
    expire_in: 1 week
    name: "$CI_PROJECT_NAME-$CI_COMMIT_BRANCH-debian-14-$CI_JOB_ID"
    paths:
      - "deploy/linux-image-*.deb"
